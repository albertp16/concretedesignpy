{% extends "base.html" %}
{% block title %}Beam Torsion Design - ConcreteDesignPy{% endblock %}

{% block content %}
<div class="calc-page">
    <a href="/" class="back-link">&larr; All Calculators</a>
    <h1>Beam Torsion Design</h1>
    <p class="ref">NSCP 2015 Section 422.7 (&equiv; ACI 318M-14)</p>

    <form id="calc-form" class="calc-form">
        <div class="form-section">
            <h3>Section Geometry</h3>
            <div class="form-row">
                <div class="form-group"><label>Width bw (mm)</label><input type="number" name="bw" value="600" required></div>
                <div class="form-group"><label>Height h (mm)</label><input type="number" name="h" value="750" required></div>
                <div class="form-group"><label>Clear cover to links Cc (mm)</label><input type="number" name="cc" value="40" required></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Cover to rebar centroid c (mm)</label><input type="number" name="c" value="65" required></div>
                <div class="form-group"><label>Effective depth d (mm)</label><input type="number" name="d" value="685" required></div>
            </div>
        </div>

        <div class="form-section">
            <h3>Material &amp; Reinforcement</h3>
            <div class="form-row">
                <div class="form-group"><label>f'c (MPa)</label><input type="number" name="fc" value="28" step="any" required></div>
                <div class="form-group"><label>fyv stirrups (MPa)</label><input type="number" name="fyv" value="420" step="any" required></div>
                <div class="form-group"><label>fy longitudinal (MPa)</label><input type="number" name="fy" value="420" step="any" required></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Stirrup &oslash; (mm)</label><input type="number" name="db_stirrup" value="12" required></div>
                <div class="form-group"><label>Long. bar &oslash; (mm)</label><input type="number" name="db_long" value="25" required></div>
                <div class="form-group"><label>Stirrup legs</label><input type="number" name="n_legs" value="2" required></div>
            </div>
        </div>

        <div class="form-section">
            <h3>Loading &amp; Stirrup Data</h3>
            <div class="form-row">
                <div class="form-group"><label>Tu (kN-m)</label><input type="number" name="tu" value="40" step="any" required></div>
                <div class="form-group"><label>Vu (kN)</label><input type="number" name="vu" value="200" step="any" required></div>
                <div class="form-group"><label>Nu (kN, + compression)</label><input type="number" name="nu" value="0" step="any"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>&phi; shear/torsion</label><input type="number" name="phi" value="0.75" step="any"></div>
                <div class="form-group"><label>Chosen spacing s (mm)</label><input type="number" name="s_chosen" value="150" required></div>
            </div>
        </div>

        <button type="submit" class="btn-primary">Calculate</button>
    </form>

    <div id="results" class="results-panel" style="display:none;">
        <h2>Results</h2>
        <div class="results-split">
            <div id="results-svg" class="results-diagram"></div>
            <div id="results-content"></div>
        </div>
        <div id="results-report" class="report-panel"></div>
    </div>
</div>

<script>
document.getElementById('calc-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var payload = {};
    new FormData(this).forEach(function(v, k) { payload[k] = parseFloat(v); });
    submitCalc('/api/beam/torsion', payload, function(result) {
        document.getElementById('results-svg').innerHTML = result.svg || '';

        var tex = '<h3>Calculation Report</h3><div class="mathjax-report">';
        tex += '<p><b>Reference:</b> NSCP 2015 Section 422.7 (\u2261 ACI 318M-14)</p>';
        tex += '<p><b>Torsional Geometry:</b></p>';
        if (result.aoh !== undefined) tex += '<p>\\[ A_{oh} = ' + result.aoh + ' \\text{ mm}^2 \\]</p>';
        if (result.ph !== undefined) tex += '<p>\\[ p_h = ' + result.ph + ' \\text{ mm} \\]</p>';
        if (result.tth !== undefined) {
            tex += '<p><b>Threshold Torsion:</b> \\[ \\phi T_{th} = ' + result.tth + ' \\text{ kN-m} \\]</p>';
        }
        if (result.tcr !== undefined) {
            tex += '<p><b>Cracking Torsion:</b> \\( \\phi T_{cr} = ' + result.tcr + ' \\text{ kN-m} \\)</p>';
        }
        if (result.torsion_action) {
            tex += '<p><b>Action:</b> ' + result.torsion_action + '</p>';
        }
        if (result.dim_check) {
            tex += '<p><b>Cross-section limit (22.7.7.1):</b> ' + result.dim_check + '</p>';
        }
        if (result.shear_status) {
            tex += '<p><b>Shear check:</b> ' + result.shear_status + '</p>';
        }
        if (result.at_s !== undefined) {
            tex += '<p><b>Required:</b> \\( A_t/s = ' + result.at_s + ' \\text{ mm}^2\\text{/mm per leg} \\)</p>';
        }
        if (result.al !== undefined) {
            tex += '<p>\\[ A_\\ell = ' + result.al + ' \\text{ mm}^2 \\]</p>';
        }
        if (result.total_req !== undefined) {
            tex += '<p><b>Total transverse:</b> \\( (A_v + 2A_t)/s = ' + result.total_req + ' \\text{ mm}^2\\text{/mm} \\)</p>';
        }
        if (result.smax !== undefined) {
            tex += '<p><b>Max spacing:</b> \\( s_{max} = ' + result.smax + ' \\text{ mm} \\) — ' + (result.spacing_check || '') + '</p>';
        }
        tex += '</div>';
        document.getElementById('results-report').innerHTML = tex;
        if (window.MathJax) MathJax.typeset();
    });
});
</script>
{% endblock %}
